<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna Bakery - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B4513;
            --primary-light: #D2691E;
            --accent: #F4A460;
            --bg-light: #FDFBF7;
            --bg-card: #FFFFFF;
            --text-main: #332211;
            --text-muted: #665544;
            --border-color: #EEDDBB;
            --shadow: 0 4px 20px rgba(139, 69, 19, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .brand-name {
            font-family: 'Playfair Display', serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            border: 2px solid var(--primary);
            transition: var(--transition);
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        /* HEADER */
        header {
            background-color: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo {
            font-size: 28px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: var(--transition);
            font-size: 15px;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* LOGIN SECTION */
        .login-section {
            padding: 90px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 160px);
            background: linear-gradient(135deg, #FDFBF7 0%, #F5EBE6 100%);
        }

        .login-card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 440px;
            padding: 45px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-control {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .login-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        footer {
            background-color: #2D1810;
            color: #EEDDBB;
            padding: 40px 0 20px;
        }

        .footer-bottom {
            text-align: center;
            font-size: 13px;
            color: #997766;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #CCAABB;
            text-decoration: none;
            font-size: 14px;
            margin-top: 10px;
            transition: var(--transition);
        }

        .social-link:hover {
            color: #FFFFFF;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container navbar">
            <a href="#" class="brand">
                <span class="brand-logo">🍪</span>
                <span class="brand-name">Apna Bakery</span>
            </a>
            <ul class="nav-links">
                <li><a href="homebakersAdda.html">Home</a></li>
                <li><a href="menu.html">Our Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="ordercart.html">Cart</a></li>
            </ul>
        </div>
    </header>

    <!-- LOG IN SECTION -->
    <section class="login-section">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Log in to access your orders and sweet rewards at Apna Bakery</p>
            </div>
            <form class="login-form" action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="login-options">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 5px;">Log In</button>
            </form>
            <div class="register-link">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container" style="text-align: center; margin-bottom: 25px;">
            <div class="brand" style="justify-content: center; margin-bottom: 10px;">
                <span class="brand-logo">🍪</span>
                <span class="brand-name" style="color: #fff;">Apna Bakery</span>
            </div>
            <a href="https://instagram.com/urfav.aditya07" target="_blank" class="social-link">
                📸 Instagram: @urfav.aditya07
            </a>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 Apna Bakery. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
